name: Build Cross-Platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller Image-Pixelator.spec --clean
        shell: bash

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller Image-Pixelator.spec --clean
        shell: bash

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libx11-xcb1 libxcb-dri3-0 libgtk-3-0
          pyinstaller Image-Pixelator.spec --clean
        shell: bash

      - name: Package artifact
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell -Command "Compress-Archive -Path dist\* -DestinationPath 'Image-Pixelator-${RUNNER_OS}.zip'"
          else
            zip -r "Image-Pixelator-${RUNNER_OS}.zip" dist/
          fi
        env:
          RUNNER_OS: ${{ runner.os }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-Pixelator-${{ runner.os }}
          path: Image-Pixelator-${{ runner.os }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Image-Pixelator-Windows/Image-Pixelator-Windows.zip
            artifacts/Image-Pixelator-macOS/Image-Pixelator-macOS.zip
            artifacts/Image-Pixelator-Linux/Image-Pixelator-Linux.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
